name: Build Windows VST3 + Standalone

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lire le numéro de version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern 'project\([A-Za-z0-9_]+ VERSION ([0-9.]+)'
          $version = $match.Matches[0].Groups[1].Value
          $exists = git tag --list "v$version"
          $publish = (-not $exists) -and ('${{ github.event_name }}' -ne 'pull_request') -and ('${{ github.ref }}' -eq 'refs/heads/main')
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version - publication : $publish"
      - name: Configure MSVC x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel 2 --target MOOGER_VST3 MOOGER_Standalone anks_audio_smoke mooger_modules mooger_percussion mooger_modulation mooger_rack mooger_processor_tests
      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Check Windows artifacts
        shell: pwsh
        run: |
          $root = 'build/MOOGER_artefacts/Release'
          $plugin = "$root/VST3/MOOGER.vst3/Contents/x86_64-win/MOOGER.vst3"
          $standalone = "$root/Standalone/MOOGER.exe"
          foreach ($file in @($plugin, $standalone)) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing build artifact: $file"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MOOGER-Windows-x64
          if-no-files-found: error
          path: |
            build/MOOGER_artefacts/Release/VST3/
            build/MOOGER_artefacts/Release/Standalone/
      - uses: actions/upload-artifact@v4
        with:
          name: MOOGER-Rack-Preview
          if-no-files-found: error
          path: build/MOOGER-rack*.png
      - name: Préparer le ZIP numéroté
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $name = "MOOGER-Windows-x64-${{ steps.version.outputs.version }}"
          $dir = "release/$name"
          New-Item -ItemType Directory -Force "$dir/VST3","$dir/Application" | Out-Null
          Get-ChildItem build -Recurse -Directory -Filter *.vst3 | Where-Object { $_.FullName -match '\\(Release\\VST3|VST3\\Release)\\[^\\]+\.vst3$' } | ForEach-Object { Copy-Item $_.FullName "$dir/VST3/" -Recurse -Force }
          if (-not (Get-ChildItem "$dir/VST3")) { throw "Aucun VST3 trouvé dans build" }
          Get-ChildItem build -Recurse -File -Filter *.exe | Where-Object { $_.FullName -match '\\Release\\Standalone\\' } | ForEach-Object { Copy-Item $_.FullName "$dir/Application/" }
          if (-not (Get-ChildItem "$dir/Application")) { Remove-Item "$dir/Application" }
          Copy-Item README.md "$dir/"
          Copy-Item Library/modules.json "$dir/module_catalog.json"
          Compress-Archive -Path $dir -DestinationPath "release/$name.zip" -Force
          Get-ChildItem release
      - name: Publier la version (onglet Releases)
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MOOGER ${{ steps.version.outputs.version }}
          prerelease: true
          files: release/*.zip
          body: |
            **MOOGER — rack modulaire libre, faces avant/arrière — ANKS Labs, gratuit.** Version de test : à essayer, pas encore une version finale.

            1. Télécharge `MOOGER-Windows-x64-${{ steps.version.outputs.version }}.zip` ci-dessous (rubrique *Assets*) et fais clic droit → **Extraire tout**.
            2. **Plugin pour Ableton** : copie le dossier `VST3\MOOGER.vst3` dans `C:\Program Files\Common Files\VST3`.
            3. Dans Live : **Préférences → Plug-ins → Dossier système VST3 = On**, puis **Relancer l'analyse**. Le plugin apparaît sous **Plug-ins**.
            4. **Sans Ableton** : lance `Application\MOOGER.exe`. Aucune installation.

            *Windows peut afficher « Windows a protégé votre ordinateur » : Informations complémentaires → Exécuter quand même (programme gratuit non signé).*

            **EN —** Download `MOOGER-Windows-x64-${{ steps.version.outputs.version }}.zip`, extract it and copy `VST3\MOOGER.vst3` to `C:\Program Files\Common Files\VST3`, then rescan plug-ins in your DAW. Or run `Application\MOOGER.exe` standalone.
